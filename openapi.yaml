openapi: 3.0.3

info:
  title: API Mercado Libre
  description: |
    API backend para el proyecto Mercado Libre. Permite gestionar usuarios,
    proveedores, categorías, productos, direcciones, carritos, pedidos y pagos.

    ## Autenticación
    La mayoría de las operaciones requieren un token JWT enviado en la cabecera:

    ```http
    Authorization: Bearer <token>
    ```

    Los tokens se obtienen en `POST /api/auth/login` o `POST /api/auth/register`
    y expiran a los 7 días. El registro público siempre crea usuarios con rol
    `cliente`; cualquier `rol` enviado en ese cuerpo se ignora.

    ## Roles y permisos
    | Recurso | Lectura | Crear / actualizar | Eliminar |
    |---|---|---|---|
    | Productos, proveedores, categorías | Público | `admin`, `vendedor` | `admin` |
    | Usuarios | Dueño o `admin` | Dueño o `admin` (solo `admin` cambia `rol`/`estado`) | `admin` (no puede eliminarse a sí mismo) |
    | Listado y alta de usuarios | `admin` | `admin` | `admin` |

    ## Actualizaciones parciales
    Los `PUT` de productos, proveedores, categorías y usuarios aceptan solo los
    campos a modificar; el resto conserva su valor actual.
  version: 1.2.0

servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Auth
    description: Registro, login y sesión
  - name: Usuarios
  - name: Proveedores
  - name: Categorias
  - name: Productos
  - name: Direcciones
  - name: Carritos
  - name: Pedidos
  - name: PedidosProveedor
    description: Pedidos agrupados por proveedor
  - name: Pagos

security:
  - bearerAuth: []

paths:

  /:
    get:
      summary: Verificar que la API responde
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: API funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: API Mercado Libre funcionando aqui

  /api/auth/register:
    post:
      summary: Registrar un cliente
      description: >
        Crea un usuario con rol `cliente` y devuelve un token. Si el cuerpo
        incluye `rol`, se ignora: los roles privilegiados solo se asignan con
        `POST /api/usuarios` usando un token de administrador.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/auth/login:
    post:
      summary: Iniciar sesión
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuario inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/auth/me:
    get:
      summary: Obtener el usuario de la sesión
      tags:
        - Auth
      responses:
        "200":
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/auth/change-password:
    put:
      summary: Cambiar la contraseña del usuario autenticado
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Token inválido o contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/usuarios:
    get:
      summary: Listar usuarios (solo admin)
      tags:
        - Usuarios
      responses:
        "200":
          description: Lista de usuarios (sin contraseñas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    post:
      summary: Crear usuario con cualquier rol (solo admin)
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCreate"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      summary: Obtener usuario por ID (dueño o admin)
      tags:
        - Usuarios
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    put:
      summary: Actualizar usuario (dueño o admin)
      description: >
        El dueño puede editar sus datos personales. Solo un `admin` puede
        cambiar `rol` o `estado`.
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El email ya está registrado por otro usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    delete:
      summary: Eliminar usuario (solo admin)
      description: Un administrador no puede eliminar su propia cuenta.
      tags:
        - Usuarios
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          description: Intento de eliminar la propia cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/proveedores:
    get:
      summary: Listar proveedores
      tags:
        - Proveedores
      security: []
      responses:
        "200":
          description: Lista de proveedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proveedor"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    post:
