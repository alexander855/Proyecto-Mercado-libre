        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    put:
      summary: Cambiar el estado del pago (solo admin)
      tags:
        - Pagos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    delete:
      summary: Eliminar pago (solo admin)
      description: No se puede eliminar un pago con estado `completado`.
      tags:
        - Pagos
      responses:
        "200":
          description: Pago eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en /api/auth/login o /api/auth/register.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador numérico del recurso.
      schema:
        type: integer
        minimum: 1

  responses:
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    NoAutorizado:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Prohibido:
      description: El rol o el dueño del recurso no tiene permisos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflicto:
      description: Conflicto con datos existentes o con registros asociados
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorInterno:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        mensaje:
          type: string
          example: Token de autenticación requerido
        detalle:
          type: string

    ValidationErrorResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Error de validación
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
                example: precio
              mensaje:
                type: string
                example: El precio debe ser un número mayor o igual a 0
              valor:
                nullable: true
                example: -1

    MensajeResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Contraseña actualizada exitosamente

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: cliente@example.com
        password:
          type: string
          format: password
          example: "Secreto123"

    RegisterInput:
      type: object
      required:
        - nombre
        - apellido
        - email
        - password
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-zA-ZáéíóúÁÉÍÓÚñÑ\\s]+$"
          example: Ana
        apellido:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-zA-ZáéíóúÁÉÍÓÚñÑ\\s]+$"
          example: Pérez
        email:
          type: string
          format: email
          maxLength: 150
          example: ana@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          example: "Secreto123"
        telefono:
          type: string
          maxLength: 30
          example: "71234567"

    ChangePasswordInput:
      type: object
      required:
        - passwordActual
        - passwordNueva
      properties:
        passwordActual:
          type: string
          format: password
          example: "Secreto123"
        passwordNueva:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          example: "NuevoSecreto456"

    AuthResponse:
      type: object
      required:
        - mensaje
        - usuario
        - token
      properties:
        mensaje:
          type: string
          example: Login exitoso
        usuario:
          $ref: "#/components/schemas/Usuario"
        token:
          type: string
          description: JWT válido por 7 días.

    Usuario:
      type: object
      required:
        - id_usuario
        - nombre
        - apellido
        - email
        - rol
        - estado
        - fecha_registro
      properties:
        id_usuario:
          type: integer
          readOnly: true
          example: 1
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: ana@example.com
        telefono:
          type: string
          nullable: true
          example: "71234567"
        rol:
          type: string
          enum: [admin, vendedor, usuario, cliente]
          example: cliente
        estado:
          type: string
          enum: [activo, inactivo]
          example: activo
        fecha_registro:
          type: string
          format: date-time
          readOnly: true

    UsuarioCreate:
      type: object
      required:
        - nombre
        - apellido
        - email
        - password
      properties:
        nombre:
