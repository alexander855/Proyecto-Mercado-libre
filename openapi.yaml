      description: >
        Registra un pago para un pedido propio (o cualquiera si es `admin`). El
        monto no puede superar el saldo disponible; los pagos `pendiente`
        reservan saldo para evitar sobrepagos. Solo un `admin` puede indicar
        `estado`; para el resto se crea en `pendiente`.
