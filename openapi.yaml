      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorCreate"
      responses:
        "201":
          description: Proveedor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/proveedores/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      summary: Obtener proveedor por ID
      tags:
        - Proveedores
      security: []
      responses:
        "200":
          description: Proveedor encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    put:
      summary: Actualizar proveedor (admin o vendedor)
      description: Actualización parcial; los campos omitidos no cambian.
      tags:
        - Proveedores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveedorUpdate"
      responses:
        "200":
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El email ya está registrado por otro proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    delete:
      summary: Eliminar proveedor (solo admin)
      tags:
        - Proveedores
      responses:
        "200":
          description: Proveedor eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveedorResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/categorias:
    get:
      summary: Listar categorías
      tags:
        - Categorias
      security: []
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    post:
      summary: Crear categoría (admin o vendedor)
      tags:
        - Categorias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaCreate"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          description: Ya existe una categoría con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/categorias/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      summary: Obtener categoría por ID
      tags:
        - Categorias
      security: []
      responses:
        "200":
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    put:
      summary: Actualizar categoría (admin o vendedor)
      description: Actualización parcial; los campos omitidos no cambian.
      tags:
        - Categorias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaUpdate"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Ya existe otra categoría con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    delete:
      summary: Eliminar categoría (solo admin)
      tags:
        - Categorias
      responses:
        "200":
          description: Categoría eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/productos:
    get:
      summary: Listar productos
      description: Incluye los nombres de la categoría y del proveedor.
      tags:
        - Productos
      security: []
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductoListado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    post:
      summary: Crear producto (admin o vendedor)
      tags:
        - Productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoCreate"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/productos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      summary: Obtener producto por ID
      tags:
        - Productos
      security: []
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    put:
      summary: Actualizar producto (admin o vendedor)
      description: Actualización parcial; los campos omitidos no cambian.
      tags:
        - Productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoUpdate"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    delete:
      summary: Eliminar producto (solo admin)
      tags:
        - Productos
      responses:
        "200":
          description: Producto eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/direcciones:
    get:
      summary: Listar direcciones
      description: >
        Un `cliente` solo ve sus propias direcciones. Un `admin` ve todas y
        puede filtrar con `id_usuario`.
      tags:
        - Direcciones
      parameters:
        - name: id_usuario
          in: query
          required: false
          description: Solo admin. Filtra las direcciones de un usuario.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lista de direcciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Direccion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    post:
      summary: Crear dirección
      description: >
        Crea una dirección para el usuario autenticado. Solo un `admin` puede
        indicar `id_usuario` para crearla a nombre de otro usuario.
      tags:
        - Direcciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DireccionCreate"
      responses:
        "201":
          description: Dirección creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DireccionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/direcciones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      summary: Obtener dirección por ID (dueño o admin)
      tags:
        - Direcciones
      responses:
        "200":
          description: Dirección encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Direccion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    put:
      summary: Actualizar dirección (dueño o admin)
      description: Actualización parcial; los campos omitidos no cambian.
      tags:
        - Direcciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DireccionUpdate"
      responses:
        "200":
          description: Dirección actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DireccionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    delete:
      summary: Eliminar dirección (dueño o admin)
      tags:
        - Direcciones
      responses:
        "200":
          description: Dirección eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DireccionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/carritos:
    get:
      summary: Listar carritos
      description: >
        Un `cliente` solo ve sus carritos. Un `admin` ve todos y puede filtrar
        por `id_usuario` y `estado`.
      tags:
        - Carritos
      parameters:
        - name: id_usuario
          in: query
          required: false
          description: Solo admin. Filtra por usuario.
          schema:
            type: integer
            minimum: 1
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [activo, convertido, abandonado]
      responses:
        "200":
          description: Lista de carritos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Carrito"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

    post:
      summary: Obtener o crear el carrito activo
      description: >
        Devuelve el carrito activo del usuario y lo crea si no existe. Responde
        `201` cuando el carrito se crea y `200` cuando ya existía.
      tags:
        - Carritos
      responses:
        "200":
          description: Carrito activo existente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarritoActivoResponse"
        "201":
          description: Carrito activo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarritoActivoResponse"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/carritos/activo:
    get:
      summary: Obtener el carrito activo con ítems y subtotal
      tags:
        - Carritos
      responses:
        "200":
          description: Carrito activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarritoConDetalles"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/carritos/{id}:
