          schema:
            type: integer
            minimum: 1
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [pendiente, confirmado, enviado, entregado, cancelado]
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pedido"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "500":
