      description: >
        Un `cliente` solo ve los pagos de sus pedidos. Un `admin` ve todos y
        puede filtrar por `id_usuario` e `id_pedido`.
      tags:
        - Pagos
      parameters:
        - name: id_usuario
          in: query
          required: false
          description: Solo admin. Filtra por usuario.
          schema:
            type: integer
            minimum: 1
        - name: id_pedido
          in: query
          required: false
          description: Filtra por pedido.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lista de pagos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pago"
